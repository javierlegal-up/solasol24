# Configuración para Netlify (se aplica sola al subir el sitio)

[build]
  publish = "."

# CACHÉ
# Estilos, scripts y páginas: el navegador SIEMPRE pregunta si hay una versión nueva
# (Netlify responde rápido "no cambió" si es la misma, así que no se pierde velocidad).
# Antes se guardaban 1 día / 1 hora y por eso, después de subir cambios,
# la página seguía mostrando la versión anterior.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Fotos: se guardan 7 días. Si reemplazás una foto, usá un NOMBRE NUEVO
# (ej: helados-2.webp) para que se vea al instante.
[[headers]]
  for = "/fotos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Seguridad básica
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Herramientas internas: que Google no las indexe
[[headers]]
  for = "/convertir-webp.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/qr.html"
  [headers.values]
    X-Robots-Tag = "noindex"
