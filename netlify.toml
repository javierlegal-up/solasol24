# Configuración para Netlify (se aplica sola al subir el sitio)

[build]
  publish = "."

# Página, estilos y código: SIEMPRE se revisa si hay una versión nueva
# (así los cambios se ven apenas se publican)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Fotos: se guardan 1 día (si reemplazás una foto con el mismo nombre, se ve al día siguiente;
# con un nombre nuevo se ve al instante)
[[headers]]
  for = "/fotos/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Seguridad básica
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Herramientas internas: que Google no las indexe
[[headers]]
  for = "/convertir-webp.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/qr.html"
  [headers.values]
    X-Robots-Tag = "noindex"
